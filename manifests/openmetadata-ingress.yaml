apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openmetadata-ingress
  namespace: openmetadata
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  # ============================================================================
  # 1. OpenMetadata UI & REST API
  # ============================================================================
  - host: openmetadata.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openmetadata
            port:
              number: 8585

  # ============================================================================
  # 2. ClickHouse Server (HTTP REST / JDBC para DBeaver)
  # Permite conexões do DBeaver e scripts HTTP via http://clickhouse.local
  # ============================================================================
  - host: clickhouse.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: clickhouse-server
            port:
              number: 8123

  # ============================================================================
  # 3. MongoDB Serving Layer (Compass / Drivers)
  # Roteamento via Ingress para http://mongodb.local
  # ============================================================================
  - host: mongodb.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mongodb
            port:
              number: 27017
