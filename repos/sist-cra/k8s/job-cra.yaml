apiVersion: batch/v1
kind: Job
metadata:
  name: pipeline-cra
  namespace: openmetadata
  labels:
    app: pipeline-cra
    data-product: dp-sist-cra
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: pipeline-cra
    spec:
      restartPolicy: Never
      containers:
      - name: runner
        image: pipeline-runner:latest
        imagePullPolicy: IfNotPresent
        command:
        - python
        - /app/repos/sist-cra/src/pipeline_cra.py
        env:
        - name: CLICKHOUSE_SERVER_HOST
          value: "clickhouse-server.openmetadata.svc.cluster.local"
        - name: CLICKHOUSE_SERVER_PORT
          value: "8123"
        - name: CLICKHOUSE_DB
          value: "investments"
        - name: CLICKHOUSE_USER
          value: "clickhouse_user"
        - name: CLICKHOUSE_PASSWORD
          value: "clickhouse_password"
        - name: OPENMETADATA_URL
          value: "http://openmetadata.openmetadata.svc.cluster.local:8585/api"
        volumeMounts:
        - name: workspace-volume
          mountPath: /app
      volumes:
      - name: workspace-volume
        hostPath:
          path: /mnt/c/Users/bruno/Workspace/ai-data-engineer-workspace/ai-datagov-openmetadata-k8s
          type: Directory
