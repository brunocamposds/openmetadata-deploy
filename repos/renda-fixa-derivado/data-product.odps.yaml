  - id: "contract-rf-gold-movimentacao-sumarizada"
    specification: "ODCS-v3.0.0"
    path: "contracts/rf-gold-movimentacao-sumarizada.odcs.yaml"
  - id: "contract-rf-mongo-serving"
    specification: "ODCS-v3.0.0"
